/* Layout: full-screen 3D race track; HUD pinned top and bottom; menus slide up as a bottom sheet */
:root{
  --ink:#0d1530;--panel:#152451;--panel2:#1f3470;--panel3:#2a4390;--edge:#ffffff;--text:#ffffff;--muted:#b9c6ea;
  --go:#38d86a;--go-d:#1c8f3f;--pets:#ff9a2e;--pets-d:#b85d07;--trail:#a45cff;--trail-d:#6427c4;
  --world:#1fc4d8;--world-d:#0d8394;--reb:#ff4fa3;--reb-d:#b5155f;--shop:#ffc83d;--shop-d:#b98100;
  --win:#ffd23f;--bad:#ff5d5d;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#0d1530;color:#fff}
body{font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
svg{display:block}
.d{font-family:var(--display);letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,0,0,.45),0 0 3px rgba(0,0,0,.5)}
#app{position:fixed;inset:0;overflow:hidden;background:#0d1530}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#hud button{pointer-events:auto}
.hud-top,.hud-bottom{width:100%;max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px 0 8px;border-radius:16px;background:rgba(13,21,48,.8);border:3px solid rgba(255,255,255,.92);box-shadow:0 4px 0 rgba(0,0,0,.3);font-size:24px;white-space:nowrap}
.pill .ic{width:30px;height:30px;flex:none}
.pill.wins{flex:1;min-width:0}
.pill.wins span{overflow:hidden;text-overflow:ellipsis}
.pill.wins .ic{color:var(--win)}
.pill.reb .ic{color:var(--reb)}
.pill.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.08)}}
.sq{width:48px;height:48px;border-radius:16px;background:rgba(13,21,48,.8);border:3px solid rgba(255,255,255,.92);box-shadow:0 4px 0 rgba(0,0,0,.3);display:grid;place-items:center;flex:none}
.sq svg{width:24px;height:24px}
.hud-mid{flex:1;min-height:0;display:flex;justify-content:space-between;align-items:flex-end;padding-block:8px;pointer-events:none}
.stats{display:flex;flex-direction:column;gap:6px;width:108px}
.stat{min-width:0;display:flex;flex-direction:column;justify-content:center;min-height:46px;padding:2px 10px;border-radius:14px;background:rgba(13,21,48,.72);border:2px solid rgba(255,255,255,.35);text-align:left}
.stat small{font:700 10px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.wld b{white-space:normal;font-size:15px}.stat.plc b{color:#ffe14d}.stat.spd b{color:#ffb15c}.stat.acc b{color:#d4a8ff}.stat.wld b{color:#7fe9f5}
.center{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 68px);text-align:center;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:0}
.center .phase{font-size:26px;color:#fff}
.center .big{font-size:54px;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.center .sub{font-size:19px;color:#fff;margin-top:4px}
.center .next{font:700 13px var(--body);color:#fff;background:rgba(13,21,48,.55);padding:4px 10px;border-radius:10px;margin-top:6px}
.center.go .big{animation:pop .4s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.meter{position:relative;height:24px;border-radius:12px;background:rgba(13,21,48,.78);border:2px solid rgba(255,255,255,.85);overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#38d86a,#ffd23f,#ff5d5d);border-radius:10px}
.meter span{position:absolute;inset:0;display:grid;place-items:center;font:400 14px var(--display);letter-spacing:.06em;text-shadow:0 1px 0 #000a}
.menu{display:flex;flex-direction:column;gap:8px}
.mbtn{position:relative;width:66px;height:56px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:400 13px var(--display);letter-spacing:.03em;text-shadow:0 1px 0 #0008;border:3px solid rgba(255,255,255,.9);transition:transform .08s}
.mbtn svg{width:24px;height:24px}
.mbtn:active{transform:translateY(3px)}

    h.innerHTML = `<h2 class="d">${best === 3 ? 'LEGENDARY!' : best === 2 ? 'EPIC!' : 'You got:'}</h2><div class="eggs">${got.map(p => { const R = RAR[petRar(p)]; return `<div class="he reveal" style="--rc:${R.color}"><div class="${petRar(p) >= 2 ? 'glow' : ''}">${petSVG(p)}</div><div class="rn">${R.name}</div><b>${petDef(p)[0]}</b><span>×${fmtX(petMult(p))} speed</span></div>`; }).join('')}</div>
      <div class="btns" style="width:min(340px,100%)"><button class="btn" id="hatchOk">Awesome!</button><button class="btn alt" id="hatchMore">Hatch again</button></div>`;
    $('hatchOk').onclick = closeHatch;
    $('hatchMore').onclick = () => { closeHatch(); hatch(got.length); };
    rerender();
  }, 1100);
}
function closeHatch() { ui.hatch = false; $('hatch').hidden = true; rerender(); }
function buyTrail(j) {
  const cost = E.trailCost(j);
  if (S.wins < cost) { needMore(cost); return; }
  S.wins -= cost; S.trails.push(j); S.trail = j; recalc(); markDirty(); save(); SFX.buy();
  toast(`${trailDef(j)[0]} equipped! Acceleration ×${fmtX(E.trailMult(j))}`);
  spawnTrail(40, 1); rerender();
}
function buyAuto() {
  const it = E.AUTO[S.auto]; if (!it) return;
  if (S.wins < it.c) { needMore(it.c); return; }
  S.wins -= it.c; S.auto++; S.autoOn = true; markDirty(); save(); SFX.buy();
  toast(`Auto Tap level ${S.auto}: ${it.r} taps a second!`); rerender();
}
function buySlot() {
  const c = E.SLOTS[S.slots - 3]; if (c == null) return;
  if (S.wins < c) { needMore(c); return; }
  S.wins -= c; S.slots++; markDirty(); save(); SFX.buy(); equipBest(); toast(`You can now equip ${S.slots} pets!`); rerender();
}
function doRebirth() {
  const cost = E.rebCost(S.reb);
  if (S.wins < cost) { needMore(cost); return; }
  const before = maxWorld();
  S.wins = 0; S.reb++; recalc(); markDirty(); save();
  SFX.rebirth(); closeSheet();
  const col = new THREE.Color();
  for (let i = 0; i < 120; i++) { col.setHSL(rnd(0.85, 1.05) % 1, 1, 0.65); burstFx.spawn(rnd(-1, 1), rnd(1, 3), rnd(-1, 1), rnd(-6, 6), rnd(2, 10), rnd(-6, 6), rnd(1, 1.8), rnd(0.3, 0.6), col, 6); }
  const after = maxWorld();
  if (after > before) { teleport(after, `New world unlocked! Boost is now ×${fmtX(rebMult())}`); }
  else { enterLobby(); showBanner('REBIRTH ' + S.reb, 'Boost ×' + fmtX(rebMult()), WORLDS.findIndex(W => W.req > S.reb) >= 0 ? `Next world at ${WORLDS.find(W => W.req > S.reb).req} rebirths` : ''); }
}
function teleport(w, sub) {
  closeSheet(); ui.fading = true; $('fade').classList.add('on');
  setTimeout(() => {
    S.world = w; S.seenWorld = Math.max(S.seenWorld, w); markDirty(); save();
    buildWorld(w); enterLobby();
    $('fade').classList.remove('on');
    setTimeout(() => { ui.fading = false; }, 200);
    showBanner('WORLD ' + (w + 1), WORLDS[w].name, sub || '×' + fmtX(Math.pow(E.W, w)) + ' wins per gate');
  }, 380);
}

/* ---------------- tutorial ---------------- */
const TUT = [
  { t: 'Walk around!', p: 'Drag on the screen or use the WASD keys to move. Press JUMP to jump. Walk onto a pad to open Pets, Trails and more. Walk to the START line to race.', ic: ['i-globe'] },
  { t: 'Tap to get fast!', p: 'Before each race you get 10 seconds. Tap the green button (or anywhere) as fast as you can. Every tap adds speed.', ic: ['i-hand'] },
  { t: 'Race and win!', p: 'Then you run on your own. Pass gates to earn wins. Beat the other racers for bonus wins!', ic: ['i-trophy'] },
  { t: 'Get stronger', p: 'Pets give more speed. Trails give more acceleration. Rebirth to unlock 10 worlds!', ic: ['i-paw', 'i-trail', 'i-reb'] },
];
function showTut(i = 0) {
  ui.tut = true; const s = TUT[i]; const el = $('tut'); el.hidden = false;
  el.innerHTML = `<div class="card"><div class="ill">${s.ic.map(c => `<svg viewBox="0 0 24 24" style="color:${c === 'i-trophy' ? 'var(--win)' : c === 'i-paw' ? 'var(--pets)' : c === 'i-trail' ? '#d4a8ff' : c === 'i-reb' ? 'var(--reb)' : '#7dffa0'}"><use href="#${c}"/></svg>`).join('')}</div>
    <h2>${s.t}</h2><p>${s.p}</p><div class="steps">${TUT.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
    <button class="btn" id="tutNext">${i < TUT.length - 1 ? 'Next' : "Let's race!"}</button></div>`;
  $('tutNext').onclick = () => { ensureAudio(); if (i < TUT.length - 1) showTut(i + 1); else { el.hidden = true; ui.tut = false; S.tut = true; markDirty(); save(); enterLobby(); } };
  $('tutNext').focus({ preventScroll: true });
}

/* ---------------- input ---------------- */
const joy = { on: false, id: null, sx: 0, sy: 0, x: 0, z: 0 };
const keys = new Set();
function joyEnd() { joy.on = false; joy.x = 0; joy.z = 0; $('joy').hidden = true; keys.clear(); }
function moveVec() {
  let x = joy.x + (keys.has('d') || keys.has('arrowright') ? 1 : 0) - (keys.has('a') || keys.has('arrowleft') ? 1 : 0);
  let z = joy.z + (keys.has('s') || keys.has('arrowdown') ? 1 : 0) - (keys.has('w') || keys.has('arrowup') ? 1 : 0);
  const l = Math.hypot(x, z); if (l > 1) { x /= l; z /= l; }
  return { x, z };
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); ensureAudio();
  if (blocked()) return;
  if (phase === 'tap' || phase === 'result') { tapAt(e.clientX, e.clientY); return; }
  joy.on = true; joy.id = e.pointerId; joy.sx = e.clientX; joy.sy = e.clientY; joy.x = 0; joy.z = 0;
  try { canvas.setPointerCapture(e.pointerId); } catch (er) { }
  const j = $('joy'); j.style.left = e.clientX + 'px'; j.style.top = e.clientY + 'px'; j.hidden = false; $('joyKnob').style.transform = '';
});
canvas.addEventListener('pointermove', e => {
  if (!joy.on || e.pointerId !== joy.id) return;
  let dx = (e.clientX - joy.sx) / 46, dy = (e.clientY - joy.sy) / 46; const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }
  joy.x = Math.abs(dx) < 0.15 ? 0 : dx; joy.z = Math.abs(dy) < 0.15 ? 0 : dy;
  $('joyKnob').style.transform = `translate(${dx * 34}px,${dy * 34}px)`;
});
const joyUp = e => { if (e.pointerId === joy.id) { joy.on = false; joy.x = 0; joy.z = 0; $('joy').hidden = true; } };
canvas.addEventListener('pointerup', joyUp); canvas.addEventListener('pointercancel', joyUp);
document.addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k) && !ui.sheet && !ui.tut && !ui.hatch) { keys.add(k); if (k.startsWith('arrow')) e.preventDefault(); } });
document.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());
$('jumpBtn').addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); jump(); });
$('tapBtn').addEventListener('pointerdown', e => { e.preventDefault(); const r = e.currentTarget.getBoundingClientRect(); tapAt(e.clientX || r.left + r.width / 2, r.top); });
$('tapBtn').addEventListener('click', e => { if (e.detail === 0) { const r = e.currentTarget.getBoundingClientRect(); tapAt(r.left + r.width / 2, r.top); } });
document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => openSheet(b.dataset.open)));
$('winsPill').addEventListener('click', () => openSheet('shop'));
$('rebPill').addEventListener('click', () => openSheet('rebirth'));
$('worldBtn').addEventListener('click', () => openSheet('worlds'));
$('sheetClose').addEventListener('click', closeSheet);
$('scrim').addEventListener('click', closeSheet);
$('muteBtn').addEventListener('click', () => { ensureAudio(); S.muted = !S.muted; markDirty(); syncMute(); });
function syncMute() { $('muteUse').setAttribute('href', S.muted ? '#i-mute' : '#i-sound'); $('muteBtn').setAttribute('aria-label', S.muted ? 'Sound off' : 'Sound on'); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (ui.hatch) closeHatch(); else if (ui.sheet) closeSheet(); return; }
  if ((e.code === 'Space' || e.key === ' ') && !ui.sheet && !ui.tut && !ui.hatch) {
    e.preventDefault(); ensureAudio(); if (phase === 'lobby' || phase === 'race') { jump(); return; } const r = $('tapBtn').getBoundingClientRect(); tapAt(r.left + r.width * rnd(0.3, 0.7), r.top);
  }
});

/* ---------------- resize & camera ---------------- */
let aspect = 1;
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  aspect = w / h; camera.aspect = aspect;
  baseFov = aspect < 0.8 ? 68 : aspect < 1.2 ? 62 : 54;
  camera.fov = baseFov; camera.updateProjectionMatrix();
  pointUniformScale.value = renderer.getDrawingBufferSize(new THREE.Vector2()).y / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
}
let baseFov = 60;
addEventListener('resize', resize);
const camBase = new THREE.Vector3(), camLook = new THREE.Vector3();
function placeCamera(sf, t, dt) {
  const portrait = aspect < 0.8;
  camBase.set(portrait ? 1.4 : 2.8, portrait ? 4.6 : 4.0, portrait ? 9.2 : 7.6);
  camBase.z += sf * 1.6; camBase.y += sf * 0.5;
  const k5 = Math.min(1, dt * 5);
  camOff.x += ((phase === 'lobby' ? pl.x : pl.x * 0.6) - camOff.x) * k5; camOff.z += (pl.z - camOff.z) * k5;
  camOff.l += ((phase === 'lobby' ? 1 : 0) - camOff.l) * k5;
  camBase.x += camOff.x; camBase.z += camOff.z + camOff.l * 4.5; camBase.y += camOff.l * 2.6;
  const shake = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : sf * 0.05;
  camera.position.set(camBase.x + Math.sin(t * 37) * shake, camBase.y + Math.cos(t * 41) * shake, camBase.z);
  camLook.set(camOff.x, portrait ? 1.2 : 1.6, -10 + camOff.z);
  camera.lookAt(camLook);
  const fov = baseFov + sf * 12;
  if (Math.abs(camera.fov - fov) > 0.05) {
    camera.fov += (fov - camera.fov) * Math.min(1, dt * 4); camera.updateProjectionMatrix();
    pointUniformScale.value = renderer.getDrawingBufferSize(new THREE.Vector2()).y / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  }
}

/* ---------------- main loop ---------------- */
let running = true, last = performance.now(), dotT = 0;
function frame(now) {
  if (!running) return;
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  try { update(dt); renderer.render(scene, camera); } catch (e) { softError(e); }
}
function update(dt) {
  clock += dt;
  const frozen = blocked();
  if (!frozen) {
    if (phase === 'tap') { phaseT += dt; autoTap(dt); if (phaseT >= E.TAP_TIME) startRace(); }
    else if (phase === 'race') { phaseT += dt; stepRace(dt); }
    else if (phase === 'result') { phaseT += dt; if (phaseT >= E.RESULT_TIME) enterLobby(); }
  }
  // free movement
  const mv = moveVec(); let moving = false;
  if (!frozen) {
    if (phase === 'lobby') {
      if (mv.x || mv.z) { moving = true; pl.x = clamp(pl.x + mv.x * 9 * dt, -18, 18); pl.z = clamp(pl.z + mv.z * 9 * dt, -2.5, 28); pl.face = Math.atan2(-mv.x, -mv.z); }
      let ins = null;
      for (const st of STATIONS) if (Math.hypot(pl.x - st.x, pl.z - st.z) < 2.5) ins = st.k;
      if (ins && ins !== pl.inside) { pl.inside = ins; joyEnd(); openSheet(ins); } else if (!ins) pl.inside = null;
      if (pl.z < 1.3 && Math.abs(pl.x) < 5.6 && !ui.sheet) startTap();
    } else if (phase === 'race') pl.x = clamp(pl.x + mv.x * 7 * dt, -4.7, 4.7);
    if (pl.y > 0 || pl.vy > 0) { pl.vy -= 30 * dt; pl.y += pl.vy * dt; if (pl.y <= 0) { pl.y = 0; pl.vy = 0; } }
  }
  runner.position.set(pl.x, pl.y, pl.z);
  { const tf = phase === 'lobby' ? pl.face : 0; let dr = tf - runner.rotation.y; dr = Math.atan2(Math.sin(dr), Math.cos(dr)); runner.rotation.y += dr * Math.min(1, dt * 12); }
  runner.userData.shadow.position.y = 0.04 - pl.y;
  if (moving && phase === 'lobby') { trailFx._acc2 = (trailFx._acc2 || 0) + dt * 30; const n2 = Math.floor(trailFx._acc2); trailFx._acc2 -= n2; if (n2) spawnTrail(n2, 0.4); }
  if (phase === 'race' || phase === 'result') { lobby.position.z += V * dt; if (lobby.position.z > 70) lobby.visible = false; }
  for (const st of STATIONS) { st.icon.rotation.y += dt * 1.2; st.icon.position.y = 2.3 + Math.sin(clock * 2 + st.x) * 0.2; }
  // visual speed
  const targetV = phase === 'race' && !frozen ? 8 + 7 * Math.log10(1 + race.v) : 0;
  V += (targetV - V) * Math.min(1, dt * (phase === 'race' ? 8 : 2.5));
  const sf = Math.min(1, Math.max(0, (V - 8) / 50)); // 0..1 speed feel

  // scroll ground & track
  const d = V * dt / TILE;
  groundMat.map.offset.y += d; trackMat.map.offset.y += d;
  // props
  for (const p of propsGroup.children) {
    p.position.z += V * dt;
    if (p.position.z > PROP_NEAR) { p.position.z -= PROP_SPAN; placeProp(p, p.userData.side); }
    p.visible = phase === 'race' || phase === 'result' || !(p.position.z > -4 && Math.abs(p.position.x) < 21);
  }
  // start arch
  if (startArch.visible) { if (phase !== 'tap') startArch.userData.z += V * dt; startArch.position.z = startArch.userData.z; if (startArch.userData.z > 30) startArch.visible = false; }
  // gates
  if (phase === 'race' || phase === 'tap') {
    const vEff = Math.max(phase === 'race' ? race.v : 0, (phase === 'race' ? race.top : built) * 0.3, 1);
    const Vf = 8 + 7 * Math.log10(1 + (phase === 'race' ? race.v : 0));
    for (let gi = race.next; gi < Math.min(20, race.next + 3); gi++) {
      const z = -((gateDist(S.world, gi) - race.dist) / vEff) * Vf;
      if (z < -180) { const a0 = assigned.get(gi); if (a0) a0.visible = false; continue; }
      const a = archFor(gi); if (!a) continue;
      a.visible = true; a.userData.z = z; a.position.z = z;
    }
  }
  for (const a of arches) {
    if (a.userData.passing) {
      a.userData.z += Math.max(V, 6) * dt; a.position.z = a.userData.z;
      a.userData.flash = Math.max(0, a.userData.flash - dt * 2);
      a.scale.setScalar(1 + a.userData.flash * 0.08);
      if (a.userData.z > 30) { a.userData.passing = false; a.userData.gate = -1; a.visible = false; a.scale.setScalar(1); }
    }
  }
  // runner animation
  const R = runner.userData;
  animRunner(R, (phase === 'race' && V > 1) || moving, sf, dt);
  // rival racers
  {
    const vE = Math.max(race.v, race.top * 0.3, 1), Vf2 = 8 + 7 * Math.log10(1 + race.v);
    for (const bt of BOTS) {
      const z = (phase === 'tap' || phase === 'lobby') ? 0 : Math.max(-150, Math.min(4, -((bt.dist - race.dist) / vE) * Vf2));
      bt.m.position.z += (z - bt.m.position.z) * Math.min(1, dt * 6);
      animRunner(bt.m.userData, phase === 'race' && bt.v > 0, sf, dt);
    }
  }
  // pets follow
  petMeshes.forEach((m, i) => {
    const s = PET_SPOTS[i] || PET_SPOTS[0];
    const lag = phase === 'race' ? sf * 0.6 : 0;
    m.position.set(pl.x + s[0], pl.y * 0.6 + s[1] + Math.sin(clock * 3 + i * 1.7) * 0.18, pl.z + s[2] + lag + Math.sin(clock * 2 + i) * 0.1);
    m.rotation.y = Math.sin(clock * 1.5 + i) * 0.25;
    m.rotation.z = phase === 'race' ? Math.sin(R.phase + i) * 0.08 : 0;
    if (m.userData.wings) m.userData.wings.forEach((w, k) => { w.rotation.z = (k ? -1 : 1) * (0.3 + Math.sin(clock * 14) * 0.35); });
  });
  // trail
  if (phase === 'race' && V > 1) {
    trailFx._acc = (trailFx._acc || 0) + dt * (S.trail >= 0 ? 90 + sf * 120 : 30 + sf * 40);
    const n = Math.floor(trailFx._acc); trailFx._acc -= n; if (n) spawnTrail(n, 1);
  }
  trailFx.update(dt, V);
  burstFx.update(dt, V * 0.6);
  updateAmbient(dt, V, clock);
  // speed lines
  lineMat.opacity = Math.max(0, sf - 0.12) * 0.55;
  if (lineMat.opacity > 0.01) {
    for (let i = 0; i < LINE_N; i++) {
      const L = lineData[i]; L.z += V * 1.8 * dt;
      if (L.z > 12) { L.z -= 80; L.x = (i % 2 ? 1 : -1) * rnd(1.8, 9); L.y = rnd(0.3, 7); }
      dummy.position.set(L.x, L.y, L.z); dummy.scale.set(1, 1, L.len * (0.6 + sf)); dummy.updateMatrix(); lines.setMatrixAt(i, dummy.matrix);
    }
    lines.instanceMatrix.needsUpdate = true; lines.visible = true;
  } else lines.visible = false;
  placeCamera(sf, clock, dt);
  updateHUD();
  dotT += dt; if (dotT > 0.5) { dotT = 0; updateDots(); }
}

/* ---------------- pause when hidden ---------------- */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { running = false; save(); if (actx) actx.suspend().catch(() => { }); }
  else if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); }
});
addEventListener('pagehide', save);

/* ---------------- boot ---------------- */
resize();
syncMute();
syncPets();
buildWorld(S.world);
enterLobby();
updateHUD(); updateDots();
if (!S.tut) showTut(0);
else showBanner('WORLD ' + (S.world + 1), WORLDS[S.world].name, 'Welcome back!');
if (document.fonts && document.fonts.load) document.fonts.load('400 40px "Lilita One"').then(() => { drawBanner(startArch, 'START', '', WORLDS[S.world].edge); freeArches(); }).catch(() => { });
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
</script>
